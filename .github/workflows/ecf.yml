name: Update ECF rating
on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_ecf.py
      - name: Commit if changed
        run: |
          git config user.name "family-board-bot"
          git config user.email "family-board-bot@users.noreply.github.com"
          git add ecf.json
          git diff --cached --quiet || (git commit -m "Update ECF rating" && git push)
