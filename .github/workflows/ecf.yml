name: Update chess ratings
on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_ecf.py
      - run: python scripts/update_fide.py
      - name: Commit if changed
        run: |
          git config user.name "family-board-bot"
          git config user.email "family-board-bot@users.noreply.github.com"
          git add ecf.json fide.json
          git diff --cached --quiet && exit 0
          git commit -m "Update chess ratings"
          git pull --rebase origin main
          git push
