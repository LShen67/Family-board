<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family board">
<title>Family board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #D9E9F2;
    --card: #FFFFFF;
    --ink: #22325A;
    --soft: #5A6B8C;
    --panel: #22325A;
    --panel-ink: #F4F7FB;
    --line: #DCE6EE;
    --sun: #F2B632;
    --up: #2E8B57;
    --down: #C0392B;
  }
  body.night {
    --bg: #121933;
    --card: #1E2848;
    --ink: #E4EAF6;
    --soft: #9AA8C6;
    --panel: #0B1029;
    --panel-ink: #C9D2E6;
    --line: #2D3961;
    --up: #6FCF97;
    --down: #F28B82;
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Fredoka", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  p { margin: 0; }

  .board {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "clock chess" "hours hours";
    gap: 16px;
    height: 100vh;
    padding: 16px;
    box-sizing: border-box;
  }
  .card { background: var(--card); border-radius: 20px; padding: 20px 24px; box-sizing: border-box; }

  /* Clock */
  .clock {
    grid-area: clock;
    background: var(--panel);
    color: var(--panel-ink);
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .time { font-size: 128px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .secs { font-size: 48px; opacity: 0.6; margin-left: 6px; }
  .date { font-size: 30px; margin-top: 12px; opacity: 0.85; }
  .countdowns { margin-top: 16px; font-size: 18px; opacity: 0.8; }
  .countdowns p { margin-top: 4px; }
  .countdowns b { font-weight: 600; }

  /* Chess */
  .chess { grid-area: chess; display: flex; flex-direction: column; justify-content: center; }
  .label { font-size: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--soft); }
  .chess-name { font-size: 30px; font-weight: 600; margin-top: 4px; }
  .chess-now { font-size: 72px; font-weight: 600; line-height: 1.05; margin-top: 4px; }
  .chess-change { font-size: 26px; margin-left: 10px; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .months { display: flex; margin-top: 12px; border-top: 2px solid var(--line); padding-top: 10px; }
  .month { flex: 1; text-align: center; }
  .month b { display: block; font-size: 30px; font-weight: 600; }
  .month span { font-size: 18px; color: var(--soft); }
  .note { font-size: 13px; color: var(--soft); margin-top: 10px; }

  /* Hourly forecast */
  .hours { grid-area: hours; display: flex; flex-direction: column; }
  .hours-head { display: flex; justify-content: space-between; align-items: baseline; }
  .wx-tip { font-size: 20px; background: var(--sun); color: #2A2208; border-radius: 999px; padding: 4px 16px; }
  .wx-tip:empty { display: none; }
  .hour-row { display: flex; flex: 1; margin-top: 10px; }
  .hour {
    flex: 1;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-left: 2px solid var(--line);
  }
  .hour:first-child { border-left: 0; }
  .h-time { font-size: 24px; color: var(--soft); }
  .h-icon { font-size: 52px; line-height: 1.2; }
  .h-temp { font-size: 40px; font-weight: 600; }
  .h-rain { font-size: 20px; color: var(--soft); }
  .msg { font-size: 26px; margin: auto; color: var(--soft); }
  .credit { font-size: 13px; color: var(--soft); margin-top: 6px; }
  .credit a { color: inherit; }

  @media (orientation: portrait) {
    .board { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; grid-template-areas: "clock" "chess" "hours"; }
    .hour-row { flex-wrap: wrap; }
    .hour { flex: 0 0 25%; padding: 8px 0; }
    .hour:nth-child(5) { border-left: 0; }
  }
</style>
</head>
<body class="day">
<main class="board">
  <section class="card clock">
    <p class="time"><span id="time">--:--</span><span id="secs" class="secs"></span></p>
    <p id="date" class="date"></p>
    <div id="countdowns" class="countdowns"></div>
  </section>

  <section class="card chess">
    <p class="label">ECF rapid rating</p>
    <p id="chessName" class="chess-name">Loading…</p>
    <p class="chess-now"><span id="chessNow"></span><span id="chessChange" class="chess-change"></span></p>
    <div id="months" class="months"></div>
    <p id="chessNote" class="note"></p>
  </section>

  <section class="card hours">
    <div class="hours-head">
      <p class="label" id="hoursTitle">Next 8 hours</p>
      <p id="wxTip" class="wx-tip"></p>
    </div>
    <div id="hourRow" class="hour-row"><p class="msg">Loading the weather…</p></div>
    <p class="credit">Weather data by <a href="https://open-meteo.com/">Open-Meteo.com</a> · Ratings from the <a href="https://rating.englishchess.org.uk/">English Chess Federation</a></p>
  </section>
</main>

<script>
(function () {
  'use strict';

  /* ===== Edit these settings ===== */
  var CONFIG = {
    place: 'Westminster',
    latitude: 51.4975,
    longitude: -0.1357,
    hours: 8,           // hourly forecast columns
    nightFrom: 19,      // dark theme from 7pm
    nightUntil: 7       // until 7am
  };

  /* Holiday countdowns. Each date is the first day off (year, month 1-12, day). */
  var HOLIDAYS = [
    { who: 'Louis', breaks: [
      ['Day of Play', 2026, 11, 23],
      ['Christmas holiday', 2026, 12, 12],
      ['Half term', 2027, 2, 13],
      ['Easter holiday', 2027, 3, 25],
      ['Bank holiday', 2027, 5, 3],
      ['Half term', 2027, 5, 29],
      ['Summer holiday', 2027, 7, 8],
      ['Half term', 2027, 10, 14],
      ['Christmas holiday', 2027, 12, 11]
    ] },
    { who: 'Leo', breaks: [
      // Add the nursery's dates here, e.g. ['Christmas closure', 2026, 12, 21]
    ] }
  ];
  /* =============================== */

  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];

  function $(id) { return document.getElementById(id); }
  function pad(n) { return n < 10 ? '0' + n : String(n); }

  function getJSON(url, ok, fail) {
    var xhr = new XMLHttpRequest();
    var done = false;
    function bad() { if (!done) { done = true; fail(); } }
    xhr.open('GET', url, true);
    xhr.timeout = 15000;
    xhr.onload = function () {
      if (done) { return; }
      if (xhr.status === 200) {
        try { var data = JSON.parse(xhr.responseText); done = true; ok(data); return; } catch (e) {}
      }
      bad();
    };
    xhr.onerror = bad;
    xhr.ontimeout = bad;
    xhr.send();
  }

  /* ---------- Clock ---------- */
  function tick() {
    var d = new Date();
    var h = d.getHours();
    $('time').textContent = pad(h) + ':' + pad(d.getMinutes());
    $('secs').textContent = pad(d.getSeconds());
    $('date').textContent = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
    var theme = (h >= CONFIG.nightFrom || h < CONFIG.nightUntil) ? 'night' : 'day';
    if (document.body.className !== theme) { document.body.className = theme; }
  }

  /* ---------- Holiday countdowns ---------- */
  function countdowns() {
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
    var html = '';
    for (var i = 0; i < HOLIDAYS.length; i++) {
      var list = HOLIDAYS[i].breaks;
      for (var j = 0; j < list.length; j++) {
        var b = list[j];
        var days = Math.round((new Date(b[1], b[2] - 1, b[3]).getTime() - today) / 86400000);
        if (days >= 0) {
          var when = days === 0 ? 'starts today 🎉' : days === 1 ? 'tomorrow' : 'in ' + days + ' days';
          html += '<p><b>' + HOLIDAYS[i].who + '</b> · ' + b[0] + ' ' + when + '</p>';
          break;
        }
      }
    }
    $('countdowns').innerHTML = html;
  }

  /* ---------- Weather ---------- */
  function icon(code, isDay) {
    if (code === 0) { return isDay ? '☀️' : '🌙'; }
    if (code === 1 || code === 2) { return isDay ? '⛅' : '☁️'; }
    if (code === 3) { return '☁️'; }
    if (code === 45 || code === 48) { return '🌫️'; }
    if (code >= 51 && code <= 57) { return '🌦️'; }
    if (code >= 61 && code <= 67) { return '🌧️'; }
    if (code >= 71 && code <= 77) { return '❄️'; }
    if (code >= 80 && code <= 82) { return '🌦️'; }
    if (code === 85 || code === 86) { return '🌨️'; }
    if (code >= 95) { return '⛈️'; }
    return '🌡️';
  }

  function tipFor(maxRain, minTemp, maxTemp) {
    if (maxRain >= 50) { return 'Rain likely. Take an umbrella.'; }
    if (minTemp <= 2) { return 'Frosty. Hats and gloves.'; }
    if (maxTemp < 10) { return 'Chilly. Wear a warm coat.'; }
    if (maxTemp >= 22) { return 'Warm. Sun cream on.'; }
    return 'Jacket weather.';
  }

  function showWeather(data) {
    var hr = data.hourly;
    // First hourly slot after the current hour (times are London local, e.g. "2026-11-21T18:00")
    var nowHour = data.current.time.slice(0, 13);
    var start = 0;
    while (start < hr.time.length && hr.time[start].slice(0, 13) <= nowHour) { start++; }

    var html = '';
    var maxRain = 0, minT = 99, maxT = -99;
    for (var i = start; i < start + CONFIG.hours && i < hr.time.length; i++) {
      var t = Math.round(hr.temperature_2m[i]);
      var rain = hr.precipitation_probability[i] || 0;
      if (rain > maxRain) { maxRain = rain; }
      if (t < minT) { minT = t; }
      if (t > maxT) { maxT = t; }
      html += '<div class="hour">' +
        '<p class="h-time">' + hr.time[i].slice(11, 16) + '</p>' +
        '<p class="h-icon">' + icon(hr.weather_code[i], hr.is_day[i] === 1) + '</p>' +
        '<p class="h-temp">' + t + '°</p>' +
        '<p class="h-rain">💧 ' + rain + '%</p>' +
        '</div>';
    }
    $('hourRow').innerHTML = html;
    $('hoursTitle').textContent = 'Next ' + CONFIG.hours + ' hours in ' + CONFIG.place + ' · now ' + Math.round(data.current.temperature_2m) + '°';
    $('wxTip').textContent = tipFor(maxRain, minT, maxT);
  }

  function loadWeather() {
    var url = 'https://api.open-meteo.com/v1/forecast' +
      '?latitude=' + CONFIG.latitude + '&longitude=' + CONFIG.longitude +
      '&current=temperature_2m' +
      '&hourly=temperature_2m,weather_code,precipitation_probability,is_day' +
      '&timezone=Europe%2FLondon&forecast_days=2';
    getJSON(url, function (data) {
      showWeather(data);
      setTimeout(loadWeather, 15 * 60 * 1000);
    }, function () {
      $('hourRow').innerHTML = '<p class="msg">📡 Weather unavailable. Trying again in 5 minutes.</p>';
      $('wxTip').textContent = '';
      setTimeout(loadWeather, 5 * 60 * 1000);
    });
  }

  /* ---------- Chess rating (ecf.json is refreshed daily by a GitHub Action) ---------- */
  function num(r) { return parseInt(r, 10); }

  function showChess(data) {
    var r = data.rapid;
    $('chessName').textContent = data.name;
    $('chessNow').textContent = num(r[0].rating);
    if (r.length > 1) {
      var diff = num(r[0].rating) - num(r[1].rating);
      var el = $('chessChange');
      el.textContent = diff > 0 ? '▲ ' + diff : diff < 0 ? '▼ ' + (-diff) : '=';
      el.className = 'chess-change ' + (diff > 0 ? 'up' : diff < 0 ? 'down' : '');
    }
    var html = '';
    for (var i = r.length - 1; i >= 0; i--) {
      html += '<div class="month"><b>' + num(r[i].rating) + '</b><span>' + r[i].month + '</span></div>';
    }
    $('months').innerHTML = html;
    $('chessNote').textContent = 'Checked ' + data.updated;
  }

  function loadChess() {
    getJSON('ecf.json?t=' + Date.now(), function (data) {
      showChess(data);
      setTimeout(loadChess, 6 * 60 * 60 * 1000);
    }, function () {
      $('chessName').textContent = 'Rating unavailable';
      setTimeout(loadChess, 30 * 60 * 1000);
    });
  }

  /* ---------- Fresh start at 3am each day ---------- */
  function scheduleReload() {
    var now = new Date();
    var next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + (now.getHours() >= 3 ? 1 : 0), 3, 0, 5);
    setTimeout(function () { window.location.reload(); }, next.getTime() - now.getTime());
  }

  tick();
  setInterval(tick, 1000);
  countdowns();
  setInterval(countdowns, 10 * 60 * 1000);
  loadWeather();
  loadChess();
  scheduleReload();
})();
</script>
</body>
</html>
